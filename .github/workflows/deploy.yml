name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: "AIzaSyD71H8mkXIHc_zY1UspZBUMwKnZ9bZEJnI"
          VITE_FIREBASE_AUTH_DOMAIN: "gen-lang-client-0252940162.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gen-lang-client-0252940162"
          VITE_FIREBASE_STORAGE_BUCKET: "gen-lang-client-0252940162.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "606863797162"
          VITE_FIREBASE_APP_ID: "1:606863797162:web:4fd5570fbab38afc8b59d3"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
